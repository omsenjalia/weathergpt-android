name: Nightly Release APK

on:
  schedule:
    # Midnight India time; release tags use the UTC calendar date.
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  gate:
    # Never publish another branch through a manually dispatched run.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      stamp: ${{ steps.gate.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "stamp=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == workflow_dispatch ]] || \
             [[ -n "$(git log -1 --since='24 hours ago' --format=%H)" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
  checks:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/ci-test.yml
  apk:
    needs: [gate, checks]
    uses: ./.github/workflows/build-apk.yml
    with:
      release: true
      stamp: ${{ needs.gate.outputs.stamp }}
    secrets: inherit
  publish:
    needs: [gate, apk]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.apk.outputs.artifact_name }}
      - name: Publish direct-download APK for the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          STAMP: ${{ needs.gate.outputs.stamp }}
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          tag="nightly-$STAMP"
          # A rerun must not replace an APK under a tag for a different commit.
          if gh release view "$tag" >/dev/null 2>&1 || \
             gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Release or tag $tag already exists; leaving its tag and APK unchanged."
            exit 1
          fi
          sha=$(sha256sum release.apk | cut -d' ' -f1)
          # VirusTotal scan (70+ engines) so judges can see the APK is clean. Best effort:
          # a VirusTotal outage never blocks the release. Files over 32 MB need an upload URL.
          report=""
          if [ -n "$VT_API_KEY" ]; then
            upload_url=$(curl -fsS -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | jq -r .data || true)
            if [ -n "$upload_url" ] && [ "$upload_url" != null ] && \
               curl -fsS -H "x-apikey: $VT_API_KEY" -F "file=@release.apk" "$upload_url" >/dev/null; then
              report="https://www.virustotal.com/gui/file/$sha"
            else
              echo "::warning::VirusTotal upload failed; publishing without a report link."
            fi
          fi
          {
            echo "**Install:** download \`release.apk\` on your Android phone (7.0+), open it, allow \"Install unknown apps\" for your browser, then tap Install."
            echo
            if [ -n "$report" ]; then
              echo "**VirusTotal report:** $report"
            else
              echo "**VirusTotal:** upload \`release.apk\` at https://www.virustotal.com to scan it."
            fi
            echo
            echo "**SHA-256:** \`$sha\`"
            echo
            echo "Built and signed by GitHub Actions from commit $RELEASE_SHA."
          } > notes.md
          gh release create "$tag" release.apk \
            --target "$RELEASE_SHA" --title "WeatherGPT Android Nightly $STAMP" \
            --latest --notes-file notes.md
