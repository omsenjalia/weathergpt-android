name: Nightly Release APK

on:
  schedule:
    # Midnight India time; release tags use the UTC calendar date.
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  gate:
    # Never publish another branch through a manually dispatched run.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      stamp: ${{ steps.gate.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "stamp=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == workflow_dispatch ]] || \
             [[ -n "$(git log -1 --since='24 hours ago' --format=%H -- . ':(exclude)README.md')" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
  checks:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/ci-test.yml
  apk:
    needs: [gate, checks]
    uses: ./.github/workflows/build-apk.yml
    with:
      release: true
      stamp: ${{ needs.gate.outputs.stamp }}
    secrets: inherit
  publish:
    needs: [gate, apk]
    runs-on: ubuntu-latest
    # VirusTotal usually finishes in 3-5 minutes; the scan wait is capped at 12.
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.apk.outputs.artifact_name }}
          path: ${{ runner.temp }}/apk
      - name: Scan with VirusTotal
        id: vt
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          APK: ${{ runner.temp }}/apk/release.apk
        run: |
          sha=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          # Best effort: without a key, or if VirusTotal is down, the release still ships.
          if [ -z "$VT_API_KEY" ]; then echo "::warning::VIRUSTOTAL_API_KEY is not set; skipping the scan."; exit 0; fi
          vt() { curl -fsS --retry 3 -H "x-apikey: $VT_API_KEY" "$@"; }
          # Files over 32 MB must go through a one-off upload URL.
          if ! upload_url=$(vt https://www.virustotal.com/api/v3/files/upload_url | jq -er .data) || \
             ! analysis=$(vt -F "file=@$APK" "$upload_url" | jq -er .data.id); then
            echo "::warning::VirusTotal upload failed; publishing without a report."; exit 0
          fi
          echo "report=https://www.virustotal.com/gui/file/$sha" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 36); do
            result=$(vt "https://www.virustotal.com/api/v3/analyses/$analysis" || true)
            if [ "$(jq -r '.data.attributes.status // empty' <<<"$result")" = completed ]; then
              jq -r '.data.attributes.stats | "malicious=\(.malicious)\nsuspicious=\(.suspicious)\nengines=\(.malicious + .suspicious + .undetected + .harmless)"' <<<"$result" >> "$GITHUB_OUTPUT"
              jq -c '.data.attributes.stats' <<<"$result"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::VirusTotal scan still running; the report link will show the result when it finishes."
      - name: Publish direct-download APK for the tested commit
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RUN_SUFFIX: r${{ github.run_number }}-${{ github.run_attempt }}
          STAMP: ${{ needs.gate.outputs.stamp }}
          APK: ${{ runner.temp }}/apk/release.apk
          SHA256: ${{ steps.vt.outputs.sha256 }}
          REPORT: ${{ steps.vt.outputs.report }}
          MALICIOUS: ${{ steps.vt.outputs.malicious }}
          SUSPICIOUS: ${{ steps.vt.outputs.suspicious }}
          ENGINES: ${{ steps.vt.outputs.engines }}
        run: |
          tag="nightly-$STAMP"
          # Tags are immutable: a second build on the same day gets its own tag.
          if gh release view "$tag" >/dev/null 2>&1 || gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            tag="$tag-$RUN_SUFFIX"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; leaving it unchanged."; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "**Install:** download \`release.apk\` on your Android phone (7.0+), open it, allow \"Install unknown apps\" for your browser, then tap Install."
            echo
            if [ -n "$REPORT" ] && [ -n "$ENGINES" ]; then
              echo "**VirusTotal report:** $REPORT — $((MALICIOUS + SUSPICIOUS)) of $ENGINES antivirus engines flagged it ($MALICIOUS malicious, $SUSPICIOUS suspicious)"
            elif [ -n "$REPORT" ]; then
              echo "**VirusTotal report:** $REPORT"
            else
              echo "**VirusTotal:** upload \`release.apk\` at https://www.virustotal.com to scan it."
            fi
            echo
            echo "**SHA-256:** \`$SHA256\`"
            echo
            echo "Built and signed by GitHub Actions from commit $RELEASE_SHA."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" "$APK" \
            --target "$RELEASE_SHA" --title "WeatherGPT Android Nightly ${tag#nightly-}" \
            --latest --notes-file "$RUNNER_TEMP/notes.md"
      - name: Point the README's judges section at this build
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.publish.outputs.tag }}
          SHA256: ${{ steps.vt.outputs.sha256 }}
          REPORT: ${{ steps.vt.outputs.report }}
          MALICIOUS: ${{ steps.vt.outputs.malicious }}
          SUSPICIOUS: ${{ steps.vt.outputs.suspicious }}
          ENGINES: ${{ steps.vt.outputs.engines }}
        run: |
          args=(README.md --repo "$GH_REPO" --tag "$TAG" --sha256 "$SHA256")
          [ -n "$REPORT" ] && args+=(--report "$REPORT")
          [ -n "$ENGINES" ] && args+=(--malicious "$MALICIOUS" --suspicious "$SUSPICIOUS" --engines "$ENGINES")
          python3 scripts/update_judges_readme.py "${args[@]}"
          if git diff --quiet -- README.md; then echo "README already up to date."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "README: judges' download -> $TAG" -- README.md
          # The release is already out; a push race only leaves the README one build behind.
          git push || echo "::warning::Could not push the README update; the release notes still carry the report."
