name: Reusable Android APK build

on:
  workflow_call:
    inputs:
      release:
        description: Require production URL and stable release signing
        type: boolean
        default: false
      stamp:
        description: UTC nightly date (YYYYMMDD)
        type: string
        default: ''
    secrets:
      BACKEND_URL:
        required: false
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false
    outputs:
      artifact_name:
        value: ${{ jobs.apk.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      artifact_name: ${{ steps.prepare.outputs.artifact_name }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            app/android/**/*.gradle.kts
            app/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
      - name: Configure backend and signing
        id: prepare
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || secrets.BACKEND_URL }}
          KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEY_PASSWORD || '' }}
          REQUIRE_RELEASE: ${{ inputs.release }}
          NIGHTLY_STAMP: ${{ inputs.stamp }}
        run: python ../scripts/prepare_android_build.py
      - run: flutter pub get
      - name: Build release-mode APK
        env:
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEY_PASSWORD || '' }}
        run: |
          flutter build apk --release \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: app/release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove transient signing material
        if: always()
        run: |
          rm -f android/app/release.keystore .env
