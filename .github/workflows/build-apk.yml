name: Reusable Android APK build

on:
  workflow_call:
    inputs:
      release:
        description: Require production URL and stable release signing
        type: boolean
        default: false
      stamp:
        description: UTC nightly date (YYYYMMDD)
        type: string
        default: ''
    secrets:
      BACKEND_URL:
        required: false
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false
    outputs:
      artifact_name:
        value: ${{ jobs.apk.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.prepare.outputs.artifact_name }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Configure backend and signing
        id: prepare
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || secrets.BACKEND_URL }}
          KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEY_PASSWORD || '' }}
          REQUIRE_RELEASE: ${{ inputs.release }}
          NIGHTLY_STAMP: ${{ inputs.stamp }}
        run: python ../scripts/prepare_android_build.py
      - run: bun install --frozen-lockfile
      # Prebuild first so setup-java's Gradle cache key can hash the generated
      # wrapper. app.config.js reads APP_VERSION / ANDROID_VERSION_CODE here.
      - name: Generate native Android project (expo prebuild)
        run: bunx expo prebuild -p android --no-install
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            app/android/**/*.gradle
            app/android/gradle/wrapper/gradle-wrapper.properties
      - name: Configure release signing (no debug-key fallback)
        if: env.SIGNING_MODE == 'signed'
        env:
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEY_PASSWORD || '' }}
        run: node scripts/configure-android-release.cjs
      - name: Build release-mode APK
        working-directory: app/android
        env:
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEY_PASSWORD || '' }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: app/release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove transient signing material
        if: always()
        run: |
          rm -rf .signing .env
