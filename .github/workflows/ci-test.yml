name: CI Test

on:
  pull_request:
  push:
    branches: [main, develop, 'arena/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend contracts (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate imports and undefined names
        run: |
          python -m compileall -q .
          ruff check . --select E9,F821,F822,F823
      - name: Offline tests (no provider credentials required)
        run: python -m pytest -q --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/junit.xml
          if-no-files-found: ignore

  flutter:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
      - name: Create non-secret test configuration
        run: cp .env.example .env
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze 2>&1 | tee analyze.txt
      - name: Test
        if: success() || failure()
        run: flutter test --reporter expanded --timeout 60s 2>&1 | tee test-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-test-results
          path: |
            app/analyze.txt
            app/test-output.txt
          if-no-files-found: ignore

  workflow-checks:
    name: Workflow and build-script checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Actions syntax and shell
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/tests -v
