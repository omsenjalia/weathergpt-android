name: CI Test

on:
  pull_request:
  push:
    branches: [main, develop, 'arena/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend contracts (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate imports and undefined names
        run: |
          python -m compileall -q .
          ruff check . --select E9,F821,F822,F823
      - name: Offline tests (no provider credentials required)
        run: python -m pytest -q --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/junit.xml
          if-no-files-found: ignore

  app:
    name: App typecheck, tests and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Create non-secret test configuration
        run: cp .env.example .env
      - run: bun install --frozen-lockfile
      - name: Typecheck (tsc strict)
        run: set -o pipefail; bun run typecheck 2>&1 | tee typecheck.txt
      - name: Unit tests (vitest)
        if: success() || failure()
        # `bun run test` runs `vitest run` with the RN/Expo aliases in
        # vitest.config.ts; `bun test` would bypass them.
        run: set -o pipefail; bun run test 2>&1 | tee test-output.txt
      - name: Export Android bundle (catch Metro and native-module regressions)
        run: bunx expo export --platform android --output-dir dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-test-results
          path: |
            app/typecheck.txt
            app/test-output.txt
          if-no-files-found: ignore

  workflow-checks:
    name: Workflow and build-script checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Actions syntax and shell
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/tests -v
